[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mambacode"
version = "1.0.0"
description = "Recall evaluation and causal state-space interventions for Falcon-Mamba"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "accelerate>=0.34,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "torch>=2.1",
  "tqdm>=4.66,<5",
  "transformers==4.49.0",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.43,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
